<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College ERP System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding: 30px;
        }
        h1 {
            color: #234e70;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 2px 10px #ccc;
        }
        button {
            background: #234e70;
            color: white;
            padding: 12px;
            margin: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #14344d;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>College ERP System</h1>
        <p>Student Management Dashboard</p>

        <button onclick="showAttendance()">Attendance</button>
        <button onclick="showTimetable()">Timetable</button>
        <button onclick="showExams()">Examinations</button>
        <button onclick="showAnnouncements()">Announcements</button>

        <div id="result">
            Welcome to College ERP!
        </div>
    </div>

    <script>
        function showAttendance() {
            document.getElementById("result").innerHTML =
                "<h3>Student Attendance</h3><p>Attendance: 85%</p>";
        }

        function showTimetable() {
            document.getElementById("result").innerHTML =
                "<h3>Class Timetable</h3><p>Monday: DevOps Lab</p><p>Tuesday: Web Development</p>";
        }

        function showExams() {
            document.getElementById("result").innerHTML =
                "<h3>Examination Schedule</h3><p>Upcoming: Semester Examination</p>";
        }

        function showAnnouncements() {
            document.getElementById("result").innerHTML =
                "<h3>College Announcements</h3><p>Welcome to the College ERP Portal!</p>";
        }
    </script>

</body>
</html>
