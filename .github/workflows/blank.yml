name: College ERP CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify HTML File
        run: |
          echo "Checking College ERP project..."
          test -f index.html
          echo "HTML file found successfully!"

      - name: Build
        run: echo "Static HTML project - no compilation required"

      - name: Test
        run: |
          grep -q "College ERP" index.html
          echo "Basic HTML content test passed!"
